name: tieba-sign

on:
  schedule:
    # 每天 00:30（北京时间）= 16:30 UTC
    - cron: "30 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Run sign-in
        env:
          TIEBA_BDUSS: ${{ secrets.TIEBA_BDUSS }}
        run: python sign.py

      - name: Publish dashboard status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/status.json
          if git diff --cached --quiet; then
            echo "Dashboard status unchanged."
          else
            git commit -m "Update sign-in dashboard status"
            git push
          fi
